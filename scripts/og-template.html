<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Manrope'; src:url('/fonts/manrope-800.woff2') format('woff2'); font-weight:800; }
  @font-face { font-family:'Inter'; src:url('/fonts/inter-500.woff2') format('woff2'); font-weight:500; }
  @font-face { font-family:'Inter'; src:url('/fonts/inter-700.woff2') format('woff2'); font-weight:700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden;
    background:
      radial-gradient(720px 460px at 88% -8%, rgba(241,196,14,.22), transparent 62%),
      radial-gradient(620px 420px at 4% 108%, rgba(241,196,14,.13), transparent 64%),
      linear-gradient(160deg,#000000,#151515);
    color:#fff; font-family:'Inter',sans-serif;
    padding:70px 80px; display:flex; flex-direction:column; justify-content:space-between;
    position:relative;
  }
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 78% 62% at 50% 0%, #000 40%, transparent 100%);
  }
  /* facciata con finestre illuminate */
  .facade { position:absolute; right:70px; bottom:0; }
  .top { position:relative; display:flex; align-items:center; justify-content:space-between; }
  .word { font-family:'Manrope',sans-serif; font-weight:800; font-size:30px; letter-spacing:2px; text-transform:uppercase; padding-left:16px; border-left:5px solid #f1c40e; }
  .tag {
    display:inline-flex; align-items:center; gap:10px;
    padding:11px 22px; border-radius:100px;
    border:1px solid rgba(241,196,14,.4); background:rgba(241,196,14,.10);
    font-size:15px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:#f1c40e;
  }
  .tag i { width:9px; height:9px; border-radius:50%; background:#f1c40e; display:block; }
  h1 {
    position:relative;
    font-family:'Manrope',sans-serif; font-weight:800; font-size:64px; line-height:1.07;
    letter-spacing:-2.4px; max-width:880px;
  }
  h1 em { font-style:normal; color:#f1c40e; }
  .bottom { position:relative; display:flex; align-items:center; gap:24px; }
  .rule { width:110px; height:5px; border-radius:3px; background:#f1c40e; flex:none; }
  .bottom p { font-size:21px; font-weight:500; color:#a8a5a2; }
</style>
</head>
<body>
  <div class="grid"></div>

  <svg class="facade" width="300" height="330" viewBox="0 0 300 330" fill="none">
    <path d="M12 328V44a8 8 0 0 1 8-8h260a8 8 0 0 1 8 8v284" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <path d="M12 44h276" stroke="rgba(241,196,14,.4)" stroke-width="2"/>
    <rect x="108" y="14" width="84" height="18" rx="4" fill="rgba(241,196,14,.18)" stroke="rgba(241,196,14,.55)" stroke-width="1.5"/>
    <g fill="rgba(241,196,14,.9)">
      <rect x="30" y="62" width="24" height="28" rx="3"/>
      <rect x="98" y="62" width="24" height="28" rx="3" fill="rgba(255,255,255,.07)"/>
      <rect x="166" y="62" width="24" height="28" rx="3"/>
      <rect x="234" y="62" width="24" height="28" rx="3" fill="rgba(255,255,255,.07)"/>
      <rect x="30" y="112" width="24" height="28" rx="3" fill="rgba(255,255,255,.07)"/>
      <rect x="98" y="112" width="24" height="28" rx="3"/>
      <rect x="166" y="112" width="24" height="28" rx="3"/>
      <rect x="234" y="112" width="24" height="28" rx="3"/>
      <rect x="30" y="162" width="24" height="28" rx="3"/>
      <rect x="98" y="162" width="24" height="28" rx="3" fill="rgba(255,255,255,.07)"/>
      <rect x="166" y="162" width="24" height="28" rx="3" fill="rgba(255,255,255,.07)"/>
      <rect x="234" y="162" width="24" height="28" rx="3"/>
      <rect x="30" y="212" width="24" height="28" rx="3" fill="rgba(255,255,255,.07)"/>
      <rect x="98" y="212" width="24" height="28" rx="3"/>
      <rect x="166" y="212" width="24" height="28" rx="3"/>
      <rect x="234" y="212" width="24" height="28" rx="3" fill="rgba(255,255,255,.07)"/>
    </g>
    <path d="M104 328v-46h92v46" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
    <path d="M88 282h124" stroke="#f1c40e" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="116" y="296" width="16" height="32" rx="2" fill="rgba(241,196,14,.3)"/>
    <rect x="168" y="296" width="16" height="32" rx="2" fill="rgba(241,196,14,.3)"/>
  </svg>

  <div class="top">
    <span class="word">CRM Hotellerie</span>
    <span class="tag"><i></i> Zoho Authorized Partner &middot; 9 anni</span>
  </div>

  <h1>Zoho CRM e marketing, <em>cuciti sul tuo hotel</em>.</h1>

  <div class="bottom">
    <span class="rule"></span>
    <p>CRM Hotellerie &middot; marketing e CRM per hotel su Zoho</p>
  </div>
</body>
</html>
